# ================================================================
#  AgentFlow docker-compose（ADR-0005）
#  用法：将环境变量放入宿主环境或与本文件同目录的 .env（仅用于
#  compose 变量替换，不进入镜像层——.dockerignore 已排除 **/.env），
#  然后 `docker compose up -d`。
#  透传清单同 ADR-0004 校验表：AI_* / 已知厂商密钥 / PORT /
#  ALLOW_PRIVATE_NET / BOCHA_API_KEY。
# ================================================================
services:
  agentflow:
    build: .
    image: agentflow:latest
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODELS: ${AI_MODELS:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-}
      ALLOW_PRIVATE_NET: ${ALLOW_PRIVATE_NET:-}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      PORT: ${PORT:-3000}
    volumes:
      - agentflow-data:/app/data   # SQLite 持久化（备份 = 复制卷内 agentflow.db）
    restart: unless-stopped

volumes:
  agentflow-data:
