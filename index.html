<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentFlow · 智能体工作流原型</title>
<style>
/* ================= 基础 ================= */
:root{
  /* ===== 色板：取自 ComfyUI 实机截图像素采样 ===== */
  --bg:#171718;             /* 画布背景（实采） */
  --panel:#141414;          /* 左 rail 背景（实采） */
  --panel2:#1d1d20;         /* 次级面板 */
  --panel3:#262729;         /* 浮动卡片（实采） */
  --topbar:#101018;         /* 顶栏背景（实采） */
  --border:#2b2b2d;
  --border2:#3a3a3e;
  --text:#e2e2e6; --text2:#a8a8b0; --text3:#6e6e76;
  --accent:#0b8ce9;         /* Queue 按钮蓝（实采） */
  --accent-soft:rgba(11,140,233,.14);
  --ok:#34d399; --warn:#f59e0b; --err:#f87171;
  --node-bg:#353535;        /* 节点体（litegraph 默认） */
  --node-border:#252525;
  --node-line:#2f2f2f;      /* 标题分隔线（node.png 实采） */
  --widget-line:#606060;    /* widget 行底线（实机为亮灰） */
  --cat-input:#4f8cff; --cat-chat:#a06bff; --cat-knowledge:#22c55e;
  --cat-tools:#f59e0b; --cat-logic:#22d3ee; --cat-output:#f472b6; --cat-human:#f87171;
  --rail-w:48px;            /* 实测左栏约 48px */
  --sidebar-w:312px;
  --props-w:264px;
  --tabsbar-h:37px;         /* 实测顶栏 37px */
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#33333d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#43434f}
::-webkit-scrollbar-track{background:transparent}
button{font-family:var(--font)}
input,select,textarea{font-family:var(--font);color:var(--text)}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--border2);
  background:var(--panel2);color:var(--text2);border-radius:7px;cursor:pointer;font-size:12px;white-space:nowrap;transition:all .15s}
.ibtn:hover{background:var(--panel3);color:var(--text);border-color:#45454f}
.ibtn:active{transform:translateY(1px)}

/* ================= 整体布局：仿 LiteGraphCanvasSplitterOverlay =================
 * 顶栏 WorkflowTabs / 左 rail / 侧栏面板 / 画布+底部面板 / 右属性面板            */
#app{display:flex;flex-direction:column;height:100%}
#main{display:flex;flex:1;min-height:0}

/* ================= 顶栏 WorkflowTabs ================= */
#tabsbar{height:var(--tabsbar-h);display:flex;align-items:center;background:var(--topbar);
  border-bottom:1px solid #303030;padding-left:6px;gap:6px;z-index:40}
#tabsbar .brand{display:flex;align-items:center;gap:7px;padding:0 10px 0 6px;font-size:12px;font-weight:700;
  color:#8a92a8;user-select:none;flex:none;letter-spacing:.3px}
#tabs-list{display:flex;align-items:center;gap:4px;overflow-x:auto;height:100%;flex:1;min-width:0}
.wtab{display:flex;align-items:center;gap:8px;height:26px;padding:0 6px 0 12px;border-radius:6px;
  background:transparent;color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap;flex:none;
  border:1px solid transparent;transition:all .12s;user-select:none}
.wtab:hover{background:#1a1a1e;color:var(--text)}
.wtab.active{background:#222324;color:var(--text)}
.wtab .wt-dot{width:7px;height:7px;border-radius:3px;background:var(--text3);flex:none}
.wtab.active .wt-dot{background:var(--accent)}
.wtab .wt-close{width:16px;height:16px;border:none;background:transparent;color:var(--text3);border-radius:4px;
  cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.wtab .wt-close:hover{background:#3a3a44;color:var(--text)}
.wtab input{background:var(--bg);border:1px solid var(--accent);border-radius:5px;height:20px;font-size:12px;
  padding:0 6px;width:120px;outline:none;color:var(--text)}
#tab-new{width:26px;height:26px;border:none;background:transparent;color:var(--text3);border-radius:7px;
  cursor:pointer;font-size:15px;flex:none;display:flex;align-items:center;justify-content:center}
#tab-new:hover{background:var(--panel2);color:var(--text)}

/* ================= 左侧图标工具栏（SideToolbar） ================= */
#rail{width:var(--rail-w);background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;z-index:35;flex:none}
.rail-group{display:flex;flex-direction:column;align-items:center;width:100%}
.rail-group.bottom{margin-top:auto}
.rail-btn{width:var(--rail-w);height:40px;border:none;background:transparent;color:#9a9aa2;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:none;
  transition:background .12s,color .12s;position:relative;user-select:none}
.rail-btn:hover{background:#1e1e21;color:#e8e8ee}
.rail-btn.selected{background:var(--panel3);color:#fff}
.rail-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail-btn .rl{display:none}
.rail-sep{width:28px;height:1px;background:var(--border2);margin:5px 0;flex:none}

/* ================= 侧栏内容面板（SideBarPanel） ================= */
#sidebar{width:var(--sidebar-w);background:var(--panel);border-right:1px solid transparent;
  display:flex;flex-direction:column;z-index:30;flex:none;min-height:0;
  max-width:0;overflow:hidden;transition:max-width .24s ease,border-color .24s}
#sidebar.open{max-width:var(--sidebar-w);border-right-color:var(--border)}
#sidebar .side-head{width:var(--sidebar-w);flex:none}
.side-head{display:flex;align-items:center;gap:9px;height:40px;padding:0 8px 0 16px;flex:none;
  border-bottom:1px solid var(--border)}
.side-head h3{font-size:12.5px;font-weight:600;flex:1}
.side-head .sh-act{display:flex;gap:4px}
.side-head .sh-btn{width:26px;height:26px;border:none;background:transparent;color:var(--text3);border-radius:6px;
  cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.side-head .sh-btn:hover{background:var(--panel2);color:var(--text)}
.side-body{flex:1;overflow-y:auto;min-height:0;width:var(--sidebar-w)}

/* 节点库 */
.lib-search{padding:10px 12px 6px}
.lib-search input{width:100%;height:30px;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;
  padding:0 10px;font-size:12px;outline:none}
.lib-search input:focus{border-color:var(--accent)}
.lib-cat{margin:2px 8px 6px}
.lib-cat-title{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:11.5px;color:var(--text2);
  cursor:pointer;user-select:none;border-radius:6px;font-weight:600}
.lib-cat-title:hover{background:var(--panel2)}
.lib-cat-title .dot{width:8px;height:8px;border-radius:3px;flex:none}
.lib-cat-title .cnt{margin-left:auto;font-size:10px;color:var(--text3)}
.lib-cat-title .arr{color:var(--text3);font-size:9px;transition:transform .15s}
.lib-cat.closed .arr{transform:rotate(-90deg)}
.lib-cat.closed .lib-items{display:none}
.lib-node{display:flex;align-items:center;gap:9px;padding:7px 9px 7px 12px;margin:1px 0 1px 12px;
  border:1px solid transparent;border-radius:8px;cursor:grab;user-select:none;transition:all .12s;position:relative}
.lib-node:hover{background:var(--panel2);border-color:var(--border2);transform:translateX(2px)}
.lib-node:active{cursor:grabbing}
.lib-node .lic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:14px;flex:none;background:var(--panel3)}
.lib-node .ln{font-size:12px;color:var(--text)}
.lib-node .ld{font-size:10px;color:var(--text3);margin-top:1px}

/* 工作流 / 模板 列表卡片 */
.wf-item{margin:8px 12px;padding:11px 12px;border:1px solid var(--border2);border-radius:10px;cursor:pointer;
  background:var(--panel2);transition:all .13s}
.wf-item:hover{border-color:#4a4a56;transform:translateY(-1px)}
.wf-item.active{border-color:var(--accent);background:var(--accent-soft)}
.wf-item .wt{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.wf-item .wt .badge{font-size:9.5px;color:var(--accent);border:1px solid rgba(123,135,255,.35);
  padding:1px 6px;border-radius:99px;font-weight:500}
.wf-item .wd{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.55}
.wf-item .wm{font-size:10.5px;color:var(--text3);margin-top:7px;font-family:var(--mono)}
.side-section-title{font-size:10.5px;color:var(--text3);letter-spacing:.6px;padding:14px 16px 4px;font-weight:600}
.side-empty{padding:26px 18px;text-align:center;color:var(--text3);font-size:11.5px;line-height:1.9}

/* 队列历史 */
.run-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border)}
.run-item .ri{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  flex:none;background:var(--panel3);font-size:12px}
.run-item .rn{font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-item .rt{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px}
.run-item .rd{font-size:11px;color:var(--text2);font-family:var(--mono);flex:none}
.run-item.ok .ri{color:var(--ok)} .run-item.stop .ri{color:var(--warn)}

/* 设置 */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
.set-row .sl{font-size:12px;color:var(--text2)}
.set-row .sd{font-size:10px;color:var(--text3);margin-top:2px}
.switch{position:relative;width:34px;height:18px;flex:none;cursor:pointer;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:#33333d;border-radius:99px;transition:.18s}
.switch i::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#9a9aa6;top:2px;left:2px;transition:.18s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{left:18px;background:#fff}
.seg{display:flex;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;padding:2px;gap:2px}
.seg button{border:none;background:transparent;color:var(--text3);font-size:11px;padding:3px 10px;border-radius:5px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent)}

/* ================= 中央区：画布 + 底部面板 ================= */
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#viewport{flex:1;position:relative;overflow:hidden;background:var(--bg);touch-action:none;min-height:0}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:2px;height:2px;overflow:visible;pointer-events:none;z-index:1}
#nodes-layer{position:absolute;left:0;top:0;z-index:2}

/* 连线 */
.edge .vis{fill:none;stroke:#66666e;stroke-width:2;transition:stroke .15s,stroke-width .15s}
.edge .hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.edge:hover .vis{stroke:#b8bcc8;stroke-width:2.6}
.edge.selected .vis{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 3px rgba(255,255,255,.5))}
.edge.hl .vis{stroke:#c8ccda;stroke-width:2.6;filter:drop-shadow(0 0 3px rgba(200,204,218,.4))}
.edge.flowing .vis{stroke-width:2.6;stroke-dasharray:7 6;animation:dashflow .45s linear infinite;
  filter:drop-shadow(0 0 4px rgba(255,255,255,.35))}
@keyframes dashflow{to{stroke-dashoffset:-13}}
.edge .edel{opacity:0;pointer-events:none;transition:opacity .15s;cursor:pointer}
.edge:hover .edel{opacity:1;pointer-events:auto}
.edge .edel circle{fill:#1d1d20;stroke:#66666e;stroke-width:1}
.edge .edel:hover circle{fill:var(--err);stroke:var(--err)}
.edge .edel circle{fill:#2a2a33}
#ghost-link{fill:none;stroke:#9aa2b8;stroke-width:2;stroke-dasharray:6 5;pointer-events:none;
  filter:drop-shadow(0 0 3px rgba(154,162,184,.4))}

/* 端口（实心圆，内嵌节点体内：中心距边框≈10.5px —— node.png/K采样器实采） */
.port{width:11px;height:11px;border-radius:50%;background:var(--pc-d,#606060);
  position:absolute;cursor:crosshair;transition:transform .12s,box-shadow .12s;z-index:3}
.port:hover,.port.compat{transform:scale(1.4);box-shadow:0 0 8px rgba(255,255,255,.4)}
.port.in{left:4px}
.port.out{right:4px}
.port-row{position:relative;display:flex;align-items:center;height:22px;font-size:11px;color:#9a9aa2}
.port-row.in{padding-left:20px}
.port-row.out{padding-right:20px;justify-content:flex-end}

/* 节点（ComfyUI 实机样式：直角 / #333 主体 / 偏移阴影 / 白色标题） */
.node{position:absolute;width:300px;background:var(--node-bg);border:1px solid transparent;
  border-radius:7px;box-shadow:3px 4px 9px rgba(0,0,0,.55);user-select:none;
  transition:box-shadow .15s,border-color .15s;overflow:visible}
.node:hover{border-color:#4a4a4a}
.node.selected{border-color:transparent;box-shadow:3px 4px 9px rgba(0,0,0,.55);
  outline:1.5px solid #8d8d8d;outline-offset:5px}
.node-head{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 9px;cursor:grab;
  color:#f2f2f4;font-weight:600;font-size:12.5px;border-bottom:1px solid var(--node-line);
  background:var(--node-bg);border-radius:6px 6px 0 0}
.node-head:active{cursor:grabbing}
.node-head .nicon{display:none}
.node-head .ntitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.node.st-running{border-color:var(--accent)}
.node.st-running .node-head{animation:headpulse .8s ease-in-out infinite alternate}
@keyframes headpulse{from{filter:brightness(.85)}to{filter:brightness(1.3)}}
.node.st-done{border-color:rgba(52,211,153,.5)}
.nstat{width:17px;height:17px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10.5px}
.node.st-running .nstat{width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.25);
  border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.node.st-done .nstat{color:#7fe3b4;font-weight:800}
.ncollapse{width:11px;height:11px;border:none;background:#7d7d7d;cursor:pointer;flex:none;
  border-radius:50%;padding:0;font-size:0;line-height:0;transition:background .12s}
.ncollapse:hover{background:#b0b0b0}
.node.collapsed .ncollapse{background:#4d4d4d}
.node-progress{height:3px;background:transparent;overflow:hidden;display:none;margin-top:-1px}
.node.st-running .node-progress{display:block}
.node-progress i{display:block;height:100%;width:0;background:var(--accent)}
.node-ports-in{padding:1px 0}
.node-ports-out{padding:2px 0 3px}
.node-widgets{padding:4px 8px 8px;display:flex;flex-direction:column;gap:4px}
.node.collapsed .node-widgets{display:none}
/* widget：药丸样式（node.png 实采） */
.wdg{display:flex;align-items:center;gap:8px;min-height:21px;padding:1px 9px;
  background:#222222;border:1px solid #545454;border-radius:6px}
.wdg:focus-within{border-color:#8a8a8a}
.wdg label{font-size:11px;color:#9a9aa2;width:70px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wdg .ctl{flex:1;min-width:0}
.wdg input[type=text],.wdg select,.wdg input[type=number]{width:100%;height:18px;background:transparent;
  border:none;border-radius:0;padding:0 2px;font-size:11.5px;outline:none;color:#d8d8dc}
.wdg input:focus,.wdg select:focus{color:#fff}
.wdg select{cursor:pointer;-webkit-appearance:none;appearance:none;
  background:transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><path d='M0 0l4 5 4-5z' fill='%23999'/></svg>") no-repeat right 4px center}
.wdg select option{background:#1d1d20;color:#ddd}
.wdg-raw{margin:0 1px}
.wdg-raw textarea{width:100%;background:#222222;border:1px solid #545454;
  border-radius:6px;padding:5px 8px;font-size:11.5px;outline:none;resize:vertical;min-height:46px;line-height:1.5;color:#d8d8dc}
.wdg-raw textarea:focus{border-color:#8a8a8a;color:#fff}
.wdg .switch{width:30px;height:16px}
.wdg .switch i::after{width:12px;height:12px}
.wdg .switch input:checked+i::after{left:16px}
.drag-num{cursor:ew-resize}
.drag-num:hover::after{content:'↔';margin-left:4px;font-size:9px;color:#fff}
/* 隐藏数字输入的原生上下箭头，改用与 select 箭头同风格的深色步进按钮 */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.numwrap{position:relative;display:inline-flex;width:100%}
.numwrap>input[type=number]{padding-right:16px}
.nspin{position:absolute;right:1px;width:13px;height:calc(50% - 1px);display:flex;align-items:center;justify-content:center;
  color:#8b8b90;cursor:pointer;border-radius:2px}
.nspin:first-of-type{top:1px}
.nspin:last-of-type{bottom:1px}
.nspin svg{width:7px;height:4.5px;display:block;pointer-events:none}
.nspin:hover{color:#e2e2e6;background:rgba(255,255,255,.07)}
.nspin:active{color:#fff}
input[type=number].num-dragging{cursor:ew-resize;user-select:none;color:#fff!important}
.node-out{display:none;margin:4px 8px 8px;padding:6px 8px;background:rgba(0,0,0,.3);border-left:2px solid #34d399;
  font-size:11px;color:#9fe0c0;line-height:1.45;word-break:break-all;max-height:66px;overflow:hidden}
.node.st-done .node-out{display:block}

/* 框选 */
#boxsel{position:absolute;border:1px dashed var(--accent);background:var(--accent-soft);display:none;z-index:15;pointer-events:none}

/* 空画布提示 */
#empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--text3);pointer-events:none;z-index:5;text-align:center}
#empty-hint .big{font-size:44px;opacity:.5}
#empty-hint p{font-size:13px;line-height:1.9}
#empty-hint kbd{background:var(--panel3);border:1px solid var(--border2);border-radius:5px;padding:1px 7px;font-size:11px;
  font-family:var(--mono);color:var(--text2)}

/* 画布顶部居中浮动运行卡（仿 TopMenuSection + ComfyActionbar，实采配色） */
#floatbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:16;
  display:flex;align-items:center;gap:4px;background:var(--panel3);border:1px solid #3a3a40;
  border-radius:6px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
#float-run{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 16px;border:none;border-radius:4px;
  background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;cursor:pointer}
#float-run:hover{filter:brightness(1.12)}
#float-stop{display:none;align-items:center;gap:7px;height:30px;padding:0 16px;border:none;border-radius:4px;
  background:#c0392b;color:#fff;font-weight:600;font-size:12.5px;cursor:pointer}
body.running #float-run{display:none}
body.running #float-stop{display:inline-flex}
#float-prog{display:none;align-items:center;gap:8px;padding:0 8px 0 12px;font-size:11.5px;color:var(--text2)}
body.running #float-prog{display:flex}
#float-prog .dotp{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#float-prog b{color:#9ecbf5;font-family:var(--mono)}
.fbtn{width:30px;height:30px;border:none;background:transparent;color:#b8b8c0;border-radius:4px;cursor:pointer;
  font-size:13px;display:flex;align-items:center;justify-content:center}
.fbtn:hover{background:#3a3a42;color:#fff}
.fbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 画布右下工具条（仿 GraphCanvasMenu：模式/适应/缩放） */
#canvas-tools{position:absolute;right:14px;bottom:14px;z-index:16;display:flex;align-items:center;gap:3px;
  background:var(--panel3);border:1px solid #3a3a40;border-radius:6px;padding:4px;
  box-shadow:0 4px 16px rgba(0,0,0,.4)}
#canvas-tools .ct-btn{width:30px;height:30px;border:none;background:transparent;color:#b8b8c0;border-radius:4px;
  cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
#canvas-tools .ct-btn:hover{background:#3a3a42;color:#fff}
#canvas-tools .ct-btn.on{background:#3a3a42;color:#fff}
#canvas-tools .ct-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#canvas-tools .ct-zoom{min-width:48px;text-align:center;font-size:11px;color:#b8b8c0;cursor:pointer;
  font-family:var(--mono);border-radius:4px;padding:6px 2px}
#canvas-tools .ct-zoom:hover{background:#3a3a42;color:#fff}
#canvas-tools .ct-sep{width:1px;height:18px;background:#3a3a40;margin:0 3px}
#canvas-stats{position:absolute;left:14px;bottom:14px;z-index:16;font-size:11px;color:var(--text3);
  background:rgba(23,23,28,.8);padding:3px 10px;border-radius:6px;backdrop-filter:blur(4px)}

/* 小地图 */
#minimap-wrap{position:absolute;right:14px;bottom:58px;z-index:16;border:1px solid #3a3a40;border-radius:6px;
  overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.4);background:#101013}
#minimap{display:block;cursor:pointer}

/* ================= 底部面板（BottomPanel：执行日志） ================= */
#bottompanel{height:224px;max-height:224px;border-top:1px solid #303030;display:flex;flex-direction:column;
  background:#141417;flex:none;overflow:hidden;transition:max-height .22s ease,border-color .22s}
#bottompanel.closed{max-height:0;border-top-color:transparent}
#bp-head{display:flex;align-items:center;gap:9px;padding:7px 14px;font-size:12px;color:var(--text2);font-weight:600;flex:none}
#bp-head .ldot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
#bp-head .ibtn{height:22px;padding:0 8px;font-size:11px;margin-left:auto}
#log-body{flex:1;overflow-y:auto;padding:2px 14px 12px;font-family:var(--mono);font-size:11px;line-height:1.5}
.logline{display:flex;gap:8px;padding:2.5px 0;color:var(--text2);animation:login .2s ease}
@keyframes login{from{opacity:0;transform:translateY(3px)}}
.logline .t{color:var(--text3);flex:none}
.logline.ok .m{color:var(--ok)}
.logline.warn .m{color:var(--warn)}
.logline.sys .m{color:#8b9dff}
.logline.err .m{color:var(--err)}

/* ================= 右侧属性面板（NodePropertiesPanel） ================= */
#rightbar{width:var(--props-w);background:var(--panel);border-left:1px solid var(--border);z-index:30;flex:none;
  display:flex;flex-direction:column;min-height:0}
#props{flex:1;overflow-y:auto;padding:14px;min-height:0}
#props h3{font-size:12px;color:var(--text2);font-weight:600;letter-spacing:.5px;margin-bottom:12px}
#props .ph{display:flex;align-items:center;gap:9px;margin-bottom:4px}
#props .ph .picon{width:34px;height:34px;border-radius:9px;background:var(--panel3);display:flex;align-items:center;
  justify-content:center;font-size:17px;border:1px solid var(--border2)}
#props .ph .pt{font-size:14px;font-weight:700}
#props .ph .pid{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px}
#props .pdesc{font-size:11px;color:var(--text3);line-height:1.6;margin:9px 0 4px}
/* 属性面板：端口 / 运行数据 / 可用变量（沿用画布色板） */
#props .psec{margin:14px 0 6px;padding-top:9px;border-top:1px solid var(--border2);font-size:10.5px;color:var(--text3);letter-spacing:.5px}
#props .pin-row{display:flex;align-items:center;gap:6px;margin:0 0 5px;font-size:11px;min-width:0}
#props .pdot{width:7px;height:7px;border-radius:50%;flex:none}
#props .pin-row .pname{color:var(--text2);flex:none;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#props .pin-row .ptype{color:var(--text3);font-size:10px;flex:none;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#props .pin-row .psrc{color:var(--text3);font-size:10px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
#props .pin-row .psrc.off{color:#5a5a62}
#props .pin-row .pval{color:var(--text2);font-size:10px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:ui-monospace,Consolas,monospace;background:rgba(0,0,0,.25);border-left:2px solid var(--accent);padding:2px 6px;border-radius:3px}
#props .pvars{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 6px}
#props .pvar{font-size:10.5px;font-family:ui-monospace,Consolas,monospace;color:#8fd3ff;background:rgba(0,128,224,.12);
  border:1px solid rgba(0,128,224,.35);border-radius:4px;padding:2px 7px;cursor:pointer}
#props .pvar:hover{background:rgba(0,128,224,.25);color:#bfe3ff}
.prow{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.prow>label{font-size:11px;color:var(--text2)}
.prow input[type=text],.prow select,.prow input[type=number]{width:100%;height:30px;background:var(--panel2);
  border:1px solid var(--border2);border-radius:7px;padding:0 9px;font-size:12px;outline:none}
.prow input:focus,.prow select:focus{border-color:var(--accent)}
.prow textarea{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;padding:8px 9px;
  font-size:12px;outline:none;resize:vertical;min-height:70px;line-height:1.6}
.prow textarea:focus{border-color:var(--accent)}
.prow .switchline{display:flex;align-items:center;justify-content:space-between}
#props .pbtns{display:flex;gap:8px;margin-top:18px}
#props .pbtns .ibtn{flex:1;justify-content:center}
#props .pbtns .danger:hover{border-color:var(--err);color:var(--err)}
.props-empty{color:var(--text3);font-size:12px;line-height:2;padding:8px 2px}
.props-empty .tips{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.props-empty .tips span{display:flex;gap:8px;align-items:center;font-size:11.5px}
.props-empty kbd{background:var(--panel3);border:1px solid var(--border2);border-radius:5px;padding:1px 7px;
  font-size:10px;font-family:var(--mono);color:var(--text2);min-width:20px;text-align:center}

/* ================= 弹窗 ================= */
.modal-mask{position:fixed;inset:0;background:rgba(8,8,12,.6);backdrop-filter:blur(3px);z-index:100;display:none;
  align-items:flex-start;justify-content:center}
.modal-mask.show{display:flex}
#search-modal .box{margin-top:12vh;width:460px;background:var(--panel2);border:1px solid var(--border2);
  border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.6);overflow:hidden}
#search-input{width:100%;height:52px;background:transparent;border:none;outline:none;padding:0 18px;
  font-size:15px;color:var(--text);border-bottom:1px solid var(--border)}
#search-input::placeholder{color:var(--text3)}
#search-list{max-height:340px;overflow-y:auto;padding:6px}
.s-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;cursor:pointer}
.s-item .sicon{width:32px;height:32px;border-radius:8px;background:var(--panel3);display:flex;align-items:center;
  justify-content:center;font-size:16px;flex:none}
.s-item .sn{font-size:13px}
.s-item .sd{font-size:11px;color:var(--text3);margin-top:1px}
.s-item .stag{margin-left:auto;font-size:10px;color:var(--text3);border:1px solid var(--border2);
  padding:2px 8px;border-radius:99px;flex:none}
.s-item:hover,.s-item.active{background:var(--accent-soft)}
.s-empty{padding:26px;text-align:center;color:var(--text3);font-size:12px}
#help-modal .box{margin-top:10vh;width:480px;background:var(--panel2);border:1px solid var(--border2);
  border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.6);padding:22px 26px}
#help-modal h2{font-size:15px;margin-bottom:16px}
#help-modal table{width:100%;border-collapse:collapse}
#help-modal td{padding:7px 4px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border)}
#help-modal td:first-child{width:160px}
#help-modal kbd{background:var(--panel3);border:1px solid var(--border2);border-radius:5px;padding:2px 8px;
  font-size:11px;font-family:var(--mono);color:var(--text)}
#help-modal .close-row{text-align:right;margin-top:16px}

/* ---- 选中节点悬浮工具条（SelectionToolbox） ---- */
#node-tb{position:absolute;z-index:22;display:none;align-items:center;gap:2px;
  background:var(--panel3);border:1px solid #3a3a40;border-radius:8px;padding:3px;
  box-shadow:0 6px 20px rgba(0,0,0,.5)}
#node-tb.show{display:flex;animation:tbup .13s ease-out}
@keyframes tbup{from{opacity:0;margin-top:8px}to{opacity:1;margin-top:0}}
.ntb-btn{width:26px;height:26px;border:none;background:transparent;color:#b8b8c0;border-radius:5px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s}
.ntb-btn:hover{background:#3a3a42;color:#fff}
.ntb-btn svg.ic{width:14px;height:14px}
.ntb-btn.exec{width:36px;background:var(--accent);color:#fff;border-radius:5px}
.ntb-btn.exec:hover{filter:brightness(1.12);background:var(--accent)}
.ntb-btn.exec svg.ic{width:12px;height:12px}
.ntb-sep{width:1px;height:16px;background:#3a3a40;margin:0 2px}
.node.st-bypass{opacity:.45}
.node.st-bypass .ntitle{text-decoration:line-through}
.node.st-bypass .node-widgets{opacity:.6}

/* ---- 能力配置 ---- */
.caps-sec{margin-top:16px;border-top:1px solid var(--border2);padding-top:12px}
.caps-title{font-size:11px;color:var(--text2);font-weight:600;letter-spacing:.5px;margin-bottom:8px}
.caps-group{font-size:10px;color:var(--text3);margin:8px 0 5px;letter-spacing:.4px}
.cap-server{border:1px solid var(--border2);border-radius:7px;margin-bottom:5px;overflow:hidden}
.cap-server.on{border-color:#4a5568}
.cap-row{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:default}
.cap-skill{cursor:pointer}
.cap-skill input{accent-color:var(--accent)}
.cap-skill.on{background:var(--accent-soft)}
.cap-name{font-size:12px;color:var(--text);font-family:var(--mono)}
.cap-count{margin-left:auto;font-size:10px;color:var(--accent);font-family:var(--mono)}
.cap-exp{width:20px;height:20px;border:none;background:transparent;color:var(--text3);cursor:pointer;
  border-radius:5px;display:flex;align-items:center;justify-content:center;flex:none}
.cap-exp:hover{background:var(--panel3);color:var(--text)}
.cap-exp svg.ic{width:12px;height:12px}
.cap-tools{border-top:1px solid var(--border);padding:3px 6px 5px;background:rgba(0,0,0,.18)}
.cap-tool{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer}
.cap-tool:hover{background:var(--panel3)}
.cap-tool input{accent-color:var(--accent)}
.cap-tool-n{font-size:11px;color:var(--text);font-family:var(--mono)}
.cap-tool-d{font-size:10px;color:var(--text3);margin-left:auto}
.caps-sum{font-size:10.5px;color:var(--text3);margin-top:8px}
.node-caps{display:flex;flex-wrap:wrap;gap:4px;padding:2px 8px 7px}
.cap-chip{font-size:10px;color:#9aa2b8;background:#222222;border:1px solid #3a3a40;border-radius:99px;
  padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
.cap-chip svg.ic{width:10px;height:10px}
.cap-chip-s{color:#c9b458;border-color:#4a4430}
.mini-tag{font-size:9px;color:var(--accent);border:1px solid rgba(11,140,233,.35);border-radius:4px;
  padding:0 4px;margin-left:4px;vertical-align:1px}

/* ---- SVG 图标 ---- */
svg.ic{width:15px;height:15px;flex:none;display:inline-block;vertical-align:-3px}
.lic svg.ic{width:15px;height:15px}
.sicon svg.ic{width:16px;height:16px}
.picon svg.ic{width:18px;height:18px}
.wf-item .wt svg.ic{width:13px;height:13px}
.run-item .ri svg.ic{width:14px;height:14px}
#ctxmenu .mi svg.ic{width:14px;height:14px}
#ctxmenu .mi .mi-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pal-drag-ghost{display:inline-flex;align-items:center}
#pal-drag-ghost svg.ic{width:15px;height:15px}
#empty-hint .big svg.ic{width:46px;height:46px;opacity:.5}
.fav svg.ic{width:13px;height:13px}
.fav.on{color:#fbbf24}
.fav.on svg.ic{fill:#fbbf24}
.wt-close svg.ic{width:11px;height:11px}
#tab-new svg.ic{width:14px;height:14px}
.sh-btn svg.ic{width:13px;height:13px}
.ibtn svg.ic{width:13px;height:13px}
#float-run svg.ic,#float-stop svg.ic{width:13px;height:13px}
#float-run span,#float-stop span{margin-left:6px}
.edge .edel line{stroke:#ccc;stroke-width:1.3;pointer-events:none}

/* ---- 深化交互 ---- */
#viewport.panning{cursor:grabbing}
body.linking #viewport,body.linking .port{cursor:crosshair}
.node:hover{box-shadow:0 8px 24px rgba(0,0,0,.5)}
.node.anim-in{animation:nodein .2s ease}
@keyframes nodein{from{opacity:0}}
.node.anim-out{animation:nodeout .17s ease forwards;pointer-events:none}
@keyframes nodeout{to{opacity:0}}
.drag-num{cursor:ew-resize}
.drag-num:hover::after{content:'↔';margin-left:4px;font-size:9px;color:var(--accent)}
input[type=number].num-dragging{cursor:ew-resize;user-select:none;border-color:var(--accent)!important}
.ntitle input{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.45);border-radius:4px;
  color:#141418;font-size:12px;font-weight:600;height:20px;padding:0 4px;outline:none}
.lib-tabs{display:flex;gap:5px;padding:9px 12px 0}
.lib-tabs button{flex:1;height:27px;border:1px solid var(--border2);background:var(--panel2);color:var(--text3);
  border-radius:7px;font-size:11.5px;cursor:pointer;transition:all .13s}
.lib-tabs button:hover{color:var(--text)}
.lib-tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(123,135,255,.4)}
.lib-items{margin-left:14px;border-left:1px solid var(--border);padding-left:2px}
.lib-node .fav{margin-left:auto;opacity:0;color:var(--text3);background:none;border:none;cursor:pointer;
  font-size:12px;padding:2px 3px;border-radius:5px;flex:none;transition:all .12s}
.lib-node:hover .fav{opacity:.9}
.lib-node .fav:hover{color:#fbbf24;background:var(--panel3)}
.lib-node .fav.on{opacity:1;color:#fbbf24}
#float-bar{position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;border-radius:2px;overflow:hidden;display:none}
body.running #float-bar{display:block}
#float-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6e7bff,#a5b0ff);transition:width .3s}

/* 右键/下拉菜单 */
#ctxmenu{position:fixed;z-index:200;min-width:180px;background:var(--panel2);border:1px solid var(--border2);
  border-radius:10px;padding:5px;box-shadow:0 16px 48px rgba(0,0,0,.55);display:none}
#ctxmenu.show{display:block}
#ctxmenu .mi{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:7px;font-size:12.5px;
  color:var(--text);cursor:pointer}
#ctxmenu .mi:hover{background:var(--accent-soft)}
#ctxmenu .mi .mk{margin-left:auto;color:var(--text3);font-size:10.5px;font-family:var(--mono)}
#ctxmenu .mi.danger{color:var(--err)}
#ctxmenu .mi.danger:hover{background:rgba(248,113,113,.12)}
#ctxmenu .msep{height:1px;background:var(--border);margin:4px 8px}
#ctxmenu .mtitle{padding:6px 11px 4px;font-size:10.5px;color:var(--text3);letter-spacing:.5px}

/* Toast */
#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:300;display:flex;
  flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--border2);color:var(--text);border-radius:9px;
  padding:9px 18px;font-size:12.5px;box-shadow:0 10px 32px rgba(0,0,0,.5);animation:toastin .22s ease;
  display:flex;align-items:center;gap:9px}
.toast.ok{border-color:rgba(52,211,153,.4)}
.toast.warn{border-color:rgba(245,158,11,.4)}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}}
.toast.out{opacity:0;transform:translateY(8px);transition:all .25s}
#pal-drag-ghost{position:fixed;z-index:999;pointer-events:none;display:none;padding:7px 12px;border-radius:8px;
  background:var(--panel3);border:1px solid var(--accent);color:var(--text);font-size:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <!-- ======== 顶栏：WorkflowTabs + 新建 ======== -->
  <header id="tabsbar">
    <span class="brand">◆ AgentFlow</span>
    <div id="tabs-list"></div>
    <button id="tab-new" title="新建空白工作流"></button>
  </header>

  <div id="main">
    <!-- ======== 左侧图标工具栏（SideToolbar） ======== -->
    <nav id="rail">
      <div class="rail-group">
        <button class="rail-btn" id="rail-menu" title="主菜单">
          <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          <span class="rl">菜单</span>
        </button>
        <div class="rail-sep"></div>
        <button class="rail-btn" data-stab="history" title="任务历史">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/></svg>
          <span class="rl">历史</span>
        </button>
        <button class="rail-btn" data-stab="nodes" title="节点库">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4a3 3 0 0 1 3 3V14"/></svg>
          <span class="rl">节点</span>
        </button>
        <button class="rail-btn" data-stab="workflows" title="工作流">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="rl">工作流</span>
        </button>
        <button class="rail-btn" data-stab="templates" title="模板">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
          <span class="rl">模板</span>
        </button>
      </div>
      <div class="rail-group bottom">
        <button class="rail-btn" id="rail-help" title="帮助 / 快捷键">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.8.3-.9 1-.9 1.7"/><circle cx="12" cy="17" r=".5"/></svg>
          <span class="rl">帮助</span>
        </button>
        <button class="rail-btn" id="rail-bp" title="底部面板（日志）">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="14" x2="21" y2="14"/></svg>
          <span class="rl">日志</span>
        </button>
        <button class="rail-btn" data-stab="settings" title="设置">

/* ================================================================
 *  标签页（WorkflowTabs）
 * ================================================================ */
function snapshotTab(){ return {name:state.name, nodes:state.nodes, edges:state.edges, nextId:state.nextId, view}; }
function syncToTabs(){ if(tabs[activeTab]) tabs[activeTab] = snapshotTab(); }
function renderTabsBar(){
  const list = $('#tabs-list');
  list.innerHTML = tabs.map((t,i)=>`
    <div class="wtab ${i===activeTab?'active':''}" data-i="${i}">
      <span class="wt-dot"></span><span class="wt-name">${esc(t.name||'未命名')}</span>
      <button class="wt-close" data-i="${i}" title="关闭">${I('x')}</button>
    </div>`).join('');
}
function switchTab(i){
  if(i===activeTab || !tabs[i]) return;
  if(running){ toast('运行中无法切换工作流','warn'); return; }
  syncToTabs();
  activeTab = i;
  const t = tabs[i];
  state = {name:t.name, nodes:t.nodes, edges:t.edges, nextId:t.nextId};
  view = t.view || {x:60,y:40,scale:1};
  clearSel(); undoStack=[]; redoStack=[];
  applyView(); renderAll(); renderTabsBar();
  if(railTab==='workflows') renderSidebar();
}
function closeTab(i){
  if(running){ toast('运行中无法关闭工作流','warn'); return; }
  if(tabs.length<=1){ toast('至少保留一个工作流标签页','warn'); return; }
  tabs.splice(i,1);
  if(activeTab>=tabs.length) activeTab = tabs.length-1;
  else if(activeTab>i) activeTab--;
  else if(activeTab===i){ const t=tabs[activeTab];
    state = {name:t.name, nodes:t.nodes, edges:t.edges, nextId:t.nextId};
    view = t.view || {x:60,y:40,scale:1};
    clearSel(); undoStack=[]; redoStack=[]; applyView(); renderAll();
  }
  renderTabsBar(); saveLocal();
  if(railTab==='workflows') renderSidebar();
}
function newTab(){
  syncToTabs();
  tabs.push({name:'未命名工作流', nodes:[], edges:[], nextId:1, view:{x:80,y:60,scale:1}});
  activeTab = tabs.length-1;
  const t = tabs[activeTab];
  state = {name:t.name, nodes:t.nodes, edges:t.edges, nextId:t.nextId};
  view = {...t.view};
  clearSel(); undoStack=[]; redoStack=[];
  applyView(); renderAll(); renderTabsBar(); saveLocal();
  if(railTab==='workflows') renderSidebar();
}
function addTabFromSample(key){
  const s = SAMPLES[key]; if(!s) return;
  syncToTabs();
  tabs.push({ name:s.name,
    nodes: s.nodes.map(n=>({...n, params:{...(n.params||{})}})),
    edges: s.edges.map(e=>({...e})),
    nextId: Math.max(...s.nodes.map(n=>n.id))+1, view:null });
  activeTab = tabs.length-1;
  const t = tabs[activeTab];
  state = {name:t.name, nodes:t.nodes, edges:t.edges, nextId:t.nextId};
  view = {x:60,y:40,scale:1};
  clearSel(); undoStack=[]; redoStack=[];
  applyView(); renderAll(); fitView(); renderAll();
  renderTabsBar(); saveLocal();
  addLog(`已从模板创建「${s.name}」`,'sys');
  if(railTab==='workflows'||railTab==='templates') renderSidebar();
}

let libTab = 'all';
function renderSideNodes(body){
  const favs = settings.favs||[];
  body.innerHTML = `
    <div class="lib-tabs">
      <button data-lt="all" class="${libTab==='all'?'on':''}">全部节点</button>
      <button data-lt="fav" class="${libTab==='fav'?'on':''}">收藏 · ${favs.length}</button>
    </div>
    <div class="lib-search"><input id="lib-q" placeholder="搜索节点…" spellcheck="false"></div>
    <div id="lib-list"></div>`;
  const paint = q=>{
    const s = (q||'').trim().toLowerCase();
    let html='', total=0;
    Object.entries(CATS).forEach(([cat,cfg])=>{
      const items = Object.entries(DEFS).filter(([k,d])=>
        d.cat===cat && (libTab!=='fav'||favs.includes(k)) &&
        (!s || (d.name+' '+d.kw+' '+d.desc+' '+cfg.name).toLowerCase().includes(s)));
      if(!items.length) return;
      total += items.length;
      html += `<div class="lib-cat" data-cat="${cat}">
        <div class="lib-cat-title"><span class="dot" style="background:${cfg.c}"></span>${cfg.name}
          <span class="cnt">${items.length}</span><span class="arr">▼</span></div>
        <div class="lib-items">${items.map(([k,d])=>`
          <div class="lib-node" data-type="${k}">
            <span class="lic" style="border-left:3px solid ${cfg.c}">${I(d.icon)}</span>
            <div><div class="ln">${esc(d.name)} ${(d.caps||[]).map(c=>`<span class="mini-tag">${c==='mcp'?'MCP':'Skill'}</span>`).join(' ')}</div><div class="ld">${esc(d.desc.slice(0,20))}…</div></div>
            <button class="fav ${favs.includes(k)?'on':''}" data-fav="${k}" title="收藏">${I('star')}</button>
          </div>`).join('')}</div></div>`;
    });
    $('#lib-list').innerHTML = html ||
      (libTab==='fav' ? '<div class="side-empty">还没有收藏<br>悬停节点卡片，点击星标收藏常用节点</div>'
                      : '<div class="side-empty">没有匹配的节点</div>');
  };
  paint('');
  $('#lib-q').addEventListener('input', e=>paint(e.target.value));
  body.querySelectorAll('.lib-tabs button').forEach(b=>
    b.addEventListener('click', ()=>{ libTab=b.dataset.lt; renderSideNodes(body); }));
}

function applyView(){
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.scale})`;
  const g = 26*view.scale;
  viewport.style.backgroundSize = `${g}px ${g}px`;
  viewport.style.backgroundPosition = `${view.x}px ${view.y}px`;
  applySettings();
  $('#zoom-lvl').textContent = Math.round(view.scale*100)+'%';
  renderMinimap(); updateStats(); updateNodeToolbox();
}
function toWorld(cx, cy){
  const r = viewport.getBoundingClientRect();
  return { x:(cx-r.left-view.x)/view.scale, y:(cy-r.top-view.y)/view.scale };
}
function zoomAt(factor, cx, cy){
  const r = viewport.getBoundingClientRect();
  cx = cx ?? r.left+r.width/2; cy = cy ?? r.top+r.height/2;
  const mx = cx-r.left, my = cy-r.top;
  const ns = clamp(view.scale*factor, 0.25, 2.5);
  const k = ns/view.scale;
  view.x = mx-(mx-view.x)*k; view.y = my-(my-view.y)*k; view.scale = ns;
  applyView();
}
function fitView(){
  if(!state.nodes.length){ view={x:80,y:60,scale:1}; applyView(); return; }
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  const rs = viewport.getBoundingClientRect();
  state.nodes.forEach(n=>{
    const el = nodesLayer.querySelector(`.node[data-id="${n.id}"]`);
    const w = el?el.offsetWidth:250, h = el?el.offsetHeight:140;
    minX=Math.min(minX,n.x); minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+w); maxY=Math.max(maxY,n.y+h);
  });
  const pad=70, bw=maxX-minX+pad*2, bh=maxY-minY+pad*2;
  const s = clamp(Math.min(rs.width/bw, rs.height/bh), 0.55, 1);
  view.scale = s;
  view.x = (rs.width-(maxX+minX)*s)/2; view.y = (rs.height-(maxY+minY)*s)/2;
  applyView();
}

function measurePorts(){
  portCache.clear();
  state.nodes.forEach(n=>{
    const el = nodesLayer.querySelector(`.node[data-id="${n.id}"]`);
    if(!el){ portCache.set(n.id,{in:[],out:[]}); return; }

    el.querySelectorAll('.port').forEach(pt=>{

function portCenter(nodeId, dir, idx){
  const n = nodeById(nodeId), m = portCache.get(nodeId);
  if(!n||!m||!m[dir][idx]) return {x:n?n.x+150:0, y:n?n.y+20:0};
  return { x:n.x+m[dir][idx].x, y:n.y+m[dir][idx].y };
}
function bezier(p1, p2){
  const dx = clamp(Math.abs(p2.x-p1.x)*.35, 30, 140);
  return `M ${p1.x} ${p1.y} C ${p1.x+dx} ${p1.y}, ${p2.x-dx} ${p2.y}, ${p2.x} ${p2.y}`;
}
function cubicMid(p1,p2){
  const dx = clamp(Math.abs(p2.x-p1.x)*.35, 30, 140);
  const c1={x:p1.x+dx,y:p1.y}, c2={x:p2.x-dx,y:p2.y}, t=.5, u=1-t;
  return { x: u*u*u*p1.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*p2.x,
           y: u*u*u*p1.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*p2.y };
}
function edgeColor(e){
  const sn = nodeById(e.fn); if(!sn) return '#5b5b68';
  const op = defOf(sn).outputs[e.fp];
  return op ? PTYPES[op.t].c : '#5b5b68';
}
function edgeD(e){ return bezier(portCenter(e.fn,'out',e.fp), portCenter(e.tn,'in',e.tp)); }
function edgeSvg(e){
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.classList.add('edge'); g.dataset.id = e.id;
  const hit = document.createElementNS('http://www.w3.org/2000/svg','path'); hit.setAttribute('class','hit');
  const vis = document.createElementNS('http://www.w3.org/2000/svg','path'); vis.setAttribute('class','vis');
  vis.setAttribute('stroke', edgeColor(e));
  const del = document.createElementNS('http://www.w3.org/2000/svg','g'); del.setAttribute('class','edel');
  del.innerHTML = '<circle r="8"/><line x1="-3" y1="-3" x2="3" y2="3"/><line x1="3" y1="-3" x2="-3" y2="3"/>';
  const tip = document.createElementNS('http://www.w3.org/2000/svg','title');
  const sn = nodeById(e.fn), tn = nodeById(e.tn);
  if(sn&&tn) tip.textContent =
    `${sn.title||defOf(sn).name}.${defOf(sn).outputs[e.fp].n} → ${tn.title||defOf(tn).name}.${defOf(tn).inputs[e.tp].n}`;
  const d = edgeD(e);
  hit.setAttribute('d',d); vis.setAttribute('d',d);
  const mid = cubicMid(portCenter(e.fn,'out',e.fp), portCenter(e.tn,'in',e.tp));
  del.setAttribute('transform',`translate(${mid.x},${mid.y})`);
  g.append(tip,hit,vis,del);
  return g;
}
function renderEdges(){
  [...edgesSvg.querySelectorAll('g.edge')].forEach(g=>g.remove());
  edgeEls.clear();
  state.edges.forEach(e=>{
    const g = edgeSvg(e);
    edgesSvg.appendChild(g);
    if(sel.edges.has(e.id)) g.classList.add('selected');
    edgeEls.set(e.id,{g,vis:g.querySelector('.vis')});
  });
  updateAllPortColors();
}
function updateEdgesOf(nodeIds){
  const ids = new Set(nodeIds);
  state.edges.forEach(e=>{
    if(!ids.has(e.fn)&&!ids.has(e.tn)) return;
    const rec = edgeEls.get(e.id); if(!rec) return;
    const d = edgeD(e);
    rec.vis.setAttribute('d',d);
    const hit = rec.g.querySelector('.hit'); hit && hit.setAttribute('d',d);
    const del = rec.g.querySelector('.edel');
    const mid = cubicMid(portCenter(e.fn,'out',e.fp), portCenter(e.tn,'in',e.tp));
    del && del.setAttribute('transform',`translate(${mid.x},${mid.y})`);
  });
}

      const open = mcpExpanded.has(sv.id);
      return `<div class="cap-server ${sel.length?'on':''}">
        <div class="cap-row">
          <label class="switch"><input type="checkbox" data-cap="mcp-server" data-sid="${sv.id}" ${sel.length?'checked':''}><i></i></label>
          <span class="cap-name">${esc(sv.name)}</span>
          <span class="cap-count">${sel.length?sel.length+'/'+sv.tools.length:''}</span>
          <button class="cap-exp" data-expand="${sv.id}" title="展开工具">${I(open?'chev-down':'chev-right')}</button>
        </div>
        ${open?`<div class="cap-tools">${sv.tools.map(t=>`
          <label class="cap-tool"><input type="checkbox" data-cap="mcp-tool" data-sid="${sv.id}" data-tool="${esc(t.n)}" ${sel.includes(t.n)?'checked':''}><span class="cap-tool-n">${esc(t.n)}</span><span class="cap-tool-d">${esc(t.d)}</span></label>`).join('')}</div>`:''}
      </div>`;
    }).join('');
  }
  if(caps.includes('skill')){
    h += `<div class="caps-group">技能 Skill</div>`;
    h += SKILL_LIST.map(sk=>`
      <label class="cap-row cap-skill ${n.skills.includes(sk.id)?'on':''}">
        <input type="checkbox" data-cap="skill" data-sid="${sk.id}" ${n.skills.includes(sk.id)?'checked':''}>
        <span class="cap-name">${esc(sk.name)}</span><span class="cap-tool-d">${esc(sk.desc)}</span>
      </label>`).join('');
  }
  h += `<div class="caps-sum">已启用 ${sum.servers} 个 MCP 服务 · ${sum.tools} 个工具 · ${sum.skills} 个技能</div></div>`;
  return h;
}

$('#props').addEventListener('change', e=>{
  if(sel.nodes.size!==1) return;
  const n = nodeById([...sel.nodes][0]); if(!n) return;
  const cap = e.target.dataset.cap;
  if(cap){
    pushUndo();
    const sid = e.target.dataset.sid;
    if(cap==='mcp-server'){
      const sv = MCP_SERVERS.find(x=>x.id===sid);
      if(e.target.checked) n.mcp[sid] = sv.tools.map(t=>t.n);
      else { delete n.mcp[sid]; }
    } else if(cap==='mcp-tool'){
      const arr = n.mcp[sid]||(n.mcp[sid]=[]);
      const tn = e.target.dataset.tool;
      const i = arr.indexOf(tn);
      if(e.target.checked && i<0) arr.push(tn);
      if(!e.target.checked && i>=0) arr.splice(i,1);
      if(!arr.length) delete n.mcp[sid];
    } else if(cap==='skill'){
      const i = n.skills.indexOf(sid);
      if(e.target.checked && i<0) n.skills.push(sid);
      if(!e.target.checked && i>=0) n.skills.splice(i,1);
    }
    saveLocal();
    const st = $('#props').scrollTop;
    rerenderNode(n); renderProps(); $('#props').scrollTop = st;
    return;
  }
  const k = e.target.dataset.k;
  if(k!==undefined){
    n.params = n.params||{};
    n.params[k] = e.target.type==='checkbox' ? e.target.checked :
                  e.target.type==='number' ? Number(e.target.value) : e.target.value;
    rerenderNode(n); renderMinimap(); saveLocal();
  }
});
$('#props').addEventListener('click', e=>{

function rerenderNode(n){

/* ----- 小地图 ----- */
function nodeSizeOf(n){
  const el = nodesLayer.querySelector(`.node[data-id="${n.id}"]`);
  return { w:(el?el.offsetWidth/view.scale:250), h:(el?el.offsetHeight/view.scale:140) };
}
function renderMinimap(){
  const cv = $('#minimap'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#141419'; ctx.fillRect(0,0,W,H);
  if(!state.nodes.length) return;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  state.nodes.forEach(n=>{ const s=nodeSizeOf(n);
    minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+s.w); maxY=Math.max(maxY,n.y+s.h); });
  const rs = viewport.getBoundingClientRect();
  const vw = rs.width/view.scale, vh = rs.height/view.scale;
  minX=Math.min(minX,-view.x/view.scale); minY=Math.min(minY,-view.y/view.scale);
  maxX=Math.max(maxX,-view.x/view.scale+vw); maxY=Math.max(maxY,-view.y/view.scale+vh);
  const pad=60; minX-=pad; minY-=pad; maxX+=pad; maxY+=pad;
  const s = Math.min(W/(maxX-minX), H/(maxY-minY));
  const ox = (W-(maxX-minX)*s)/2, oy = (H-(maxY-minY)*s)/2;
  const tx = x=>ox+(x-minX)*s, ty = y=>oy+(y-minY)*s;
  ctx.strokeStyle = 'rgba(139,152,255,.7)'; ctx.lineWidth = 1;
  ctx.strokeRect(tx(-view.x/view.scale), ty(-view.y/view.scale), vw*s, vh*s);
  ctx.fillStyle = 'rgba(139,152,255,.06)';
  ctx.fillRect(tx(-view.x/view.scale), ty(-view.y/view.scale), vw*s, vh*s);
  state.nodes.forEach(n=>{
    const sz = nodeSizeOf(n), w = sz.w*s, h = sz.h*s;
    ctx.fillStyle = catColor(defOf(n).cat); ctx.globalAlpha = sel.nodes.has(n.id)?1:.65;
    ctx.fillRect(tx(n.x), ty(n.y), Math.max(w,3), Math.max(h,3));
    ctx.globalAlpha = 1;
    if(sel.nodes.has(n.id)){ ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(tx(n.x),ty(n.y),Math.max(w,3),Math.max(h,3)); }
  });
}
$('#minimap').addEventListener('mousedown', e=>{
  e.preventDefault(); e.stopPropagation();
  const move = ev=>{
    const cv = $('#minimap'), r = cv.getBoundingClientRect();
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    state.nodes.forEach(n=>{ const s=nodeSizeOf(n);
      minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+s.w); maxY=Math.max(maxY,n.y+s.h); });
    if(minX>maxX) return;
    const pad=60; minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
    const s = Math.min(r.width/(maxX-minX), r.height/(maxY-minY));
    const ox=(r.width-(maxX-minX)*s)/2, oy=(r.height-(maxY-minY)*s)/2;
    const wx = minX+((ev.clientX-r.left)-ox)/s, wy = minY+((ev.clientY-r.top)-oy)/s;
    const rs = viewport.getBoundingClientRect();
    view.x = rs.width/2 - wx*view.scale; view.y = rs.height/2 - wy*view.scale;
    applyView();
  };
  move(e);
  const up = ()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
  window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
});
function updateStats(){
  $('#canvas-stats').textContent = `节点 ${state.nodes.length} · 连线 ${state.edges.length} · ${Math.round(view.scale*100)}%`;
}

/* ================================================================
 *  选择
 * ================================================================ */
function clearSel(){ sel.nodes.clear(); sel.edges.clear(); refreshSel(); }
function updatePortColors(nodeId){
  const n = nodeById(nodeId); if(!n) return;
  const el = nodesLayer.querySelector(`.node[data-id="${nodeId}"]`); if(!el) return;
  const def = defOf(n);
  el.querySelectorAll('.port').forEach(pt=>{
    const dir = pt.dataset.dir, p = +pt.dataset.p;
    const t = dir==='in' ? def.inputs[p].t : def.outputs[p].t;
    const e = state.edges.find(e => dir==='in' ? (e.tn===nodeId&&e.tp===p) : (e.fn===nodeId&&e.fp===p));
    if(!e){ pt.style.setProperty('--pc-d', PTYPES[t].dc); return; }
    // 已连接：any 类型显示实际对端类型色，其余用自己的亮色
    let shown = t;
    if(t==='any'){
      const other = dir==='in'
        ? defOf(nodeById(e.fn)).outputs[e.fp].t
        : (defOf(nodeById(e.tn)).inputs[e.tp].t);
      shown = other==='any' ? t : other;
    }
    pt.style.setProperty('--pc-d', PTYPES[shown].pc);
  });
}
function updateAllPortColors(){ state.nodes.forEach(n=>updatePortColors(n.id)); }
/* ----- 选中节点悬浮工具条（SelectionToolbox） ----- */
function updateNodeToolbox(){
  const tb = $('#node-tb');
  if(!sel.nodes.size){
    tb.classList.remove('show'); tb.style.display='none'; return;
  }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  sel.nodes.forEach(id=>{
    const el = nodesLayer.querySelector(`.node[data-id="${id}"]`);
    if(!el) return;
    const r = el.getBoundingClientRect();
    minX=Math.min(minX,r.left); minY=Math.min(minY,r.top);
    maxX=Math.max(maxX,r.right); maxY=Math.max(maxY,r.bottom);
  });
  if(minX===Infinity){ tb.classList.remove('show'); tb.style.display='none'; return; }
  const vpR = viewport.getBoundingClientRect();
  const cx = (minX+maxX)/2 - vpR.left;
  const wasShown = tb.classList.contains('show');
  tb.style.display='flex';
  if(!wasShown) tb.classList.add('show');
  const single = sel.nodes.size===1;
  [['ntb-info',single],['ntb-bypass',single],['ntb-refresh',single],['ntb-exec',single&&!running],['ntb-more',single]]
    .forEach(([id,vis])=>{ $('#'+id).style.display = vis?'':'none'; });
  if(!single) $('#ntb-del').style.flex = '1';
  else $('#ntb-del').style.flex = '';
  // 默认悬浮在选区上方居中；顶部空间不足时翻到下方
  const above = (minY - vpR.top) > 52;
  const x = cx, y = above ? (minY - vpR.top - 10) : (maxY - vpR.top + 10);
  tb.style.left = x+'px'; tb.style.top = y+'px';
  tb.style.transform = 'translateX(-50%) translateY(-100%)';
  if(!above) tb.style.transform = 'translateX(-50%)';
}
function runSingleNode(n){
  if(running) return;
  running = true; stopFlag = false;
  const el = nodeEl(n.id);
  el.classList.remove('st-done','st-error');
  el.classList.add('st-running');
  measurePorts(); updateEdgesOf([n.id]);
  const def = defOf(n), meta = RUN_META[n.type]||{dur:600,out:()=>'完成'};
  const dur = meta.dur/(settings.speed||1);
  addLog(`▶ ${esc(n.title||def.name)} · 单节点执行 <span style="color:var(--text3)">#${n.id}</span>`);
  const bar = el.querySelector('.node-progress i');
  bar.style.transition='none'; bar.style.width='0%'; void bar.offsetWidth;
  bar.style.transition=`width ${dur}ms linear`; bar.style.width='100%';
  cancellableSleep(dur).then(()=>{
    const outText = meta.out(n);
    el.classList.remove('st-running');
    el.classList.add('st-done');
    setNodeOut(n.id, outText);
    measurePorts(); updateEdgesOf([n.id]);
    addLog(`✓ ${esc(n.title||def.name)} · 单节点执行完成 · ${(dur/1000).toFixed(1)}s`,'ok');
    running = false; updateNodeToolbox();
  });
}
function refreshSel(){
  updateNodeToolbox();
  nodesLayer.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected', sel.nodes.has(+el.dataset.id)));
  edgeEls.forEach((rec,id)=>{
    rec.g.classList.toggle('selected', sel.edges.has(id));
    rec.g.classList.remove('hl');
  });
  if(sel.nodes.size){
    state.edges.forEach(e=>{
      if(sel.nodes.has(e.fn)||sel.nodes.has(e.tn)){
        const rec = edgeEls.get(e.id); rec&&rec.g.classList.add('hl');
      }
    });
  }
  renderProps();
}
function selectNode(id, additive){
  if(!additive){ sel.nodes.clear(); sel.edges.clear(); }
  sel.nodes.has(id) && additive ? sel.nodes.delete(id) : sel.nodes.add(id);
  refreshSel();
}
function selectAll(){ sel.nodes=new Set(state.nodes.map(n=>n.id)); sel.edges.clear(); refreshSel(); }

/* ================================================================
 *  编辑操作
 * ================================================================ */
function pushUndo(){
  undoStack.push(JSON.stringify({nodes:state.nodes, edges:state.edges, name:state.name}));
  if(undoStack.length>60) undoStack.shift();
  redoStack.length = 0;
}
function undo(){
  if(!undoStack.length||running) return;
  redoStack.push(JSON.stringify({nodes:state.nodes, edges:state.edges, name:state.name}));
  const s = JSON.parse(undoStack.pop());
  Object.assign(state, s); state.name = s.name; clearSel(); renderAll(); renderTabsBar(); toast('已撤销');
}
function redo(){
  if(!redoStack.length||running) return;
  undoStack.push(JSON.stringify({nodes:state.nodes, edges:state.edges, name:state.name}));
  const s = JSON.parse(redoStack.pop());
  Object.assign(state, s); state.name = s.name; clearSel(); renderAll(); renderTabsBar(); toast('已重做');
}
function addNode(type, x, y, extra){
  pushUndo();
  const def = DEFS[type];
  const n = { id:state.nextId++, type, x:Math.round(x), y:Math.round(y),
              title: extra?.title || def.name, params: extra?.params ? {...extra.params} : {} };
  state.nodes.push(n);
  const el = makeNodeEl(n);
  el.classList.add('anim-in');
  nodesLayer.appendChild(el);
  setTimeout(()=>{ el.classList.remove('anim-in'); measurePorts(); updateEdgesOf([n.id]); }, 220);
  measurePorts(); renderMinimap(); updateStats();
  $('#empty-hint').style.display='none';
  saveLocal();
  return n;
}
function removeNode(id){
  state.edges = state.edges.filter(e=>e.fn!==id && e.tn!==id);
  state.nodes = state.nodes.filter(n=>n.id!==id);
  const el = nodesLayer.querySelector(`.node[data-id="${id}"]`);
  if(el){ el.classList.add('anim-out'); const gone=el; setTimeout(()=>gone.remove(), 180); }
  portCache.delete(id);
  renderEdges(); renderMinimap(); updateStats();
  $('#empty-hint').style.display = state.nodes.length?'none':'flex';
  saveLocal();
}
function removeEdge(id){
  state.edges = state.edges.filter(e=>e.id!==id);
  const g = edgesSvg.querySelector(`g.edge[data-id="${id}"]`); g&&g.remove();
  edgeEls.delete(id); updateStats(); saveLocal();
}
function addEdge(fn,fp,tn,tp){
  const sn = nodeById(fn), tnn = nodeById(tn);
  if(!sn||!tnn||sn===tnn) return false;
  const so = defOf(sn).outputs[fp], ti = defOf(tnn).inputs[tp];
  if(!so||!ti||!typeOk(so.t,ti.t)) return false;
  if(state.edges.some(e=>e.fn===fn&&e.fp===fp&&e.tn===tn&&e.tp===tp)) return false;
  pushUndo();
  const e = { id:Date.now()+Math.floor(Math.random()*1000), fn,fp,tn,tp };
  state.edges.push(e);
  const g = edgeSvg(e);
  edgesSvg.appendChild(g);
  edgeEls.set(e.id,{g,vis:g.querySelector('.vis')});
  // 连线绘制生长动画
  try{
    const vis = g.querySelector('.vis'), L = vis.getTotalLength();
    vis.style.transition='none';
    vis.style.strokeDasharray=L; vis.style.strokeDashoffset=L;
    void vis.getBoundingClientRect();
    vis.style.transition='stroke-dashoffset .26s ease';
    vis.style.strokeDashoffset='0';
    setTimeout(()=>{ vis.style.strokeDasharray=''; vis.style.transition=''; }, 320);
  }catch(_){}
  updatePortColors(fn); updatePortColors(tn);
  updateStats(); saveLocal();
  return true;
}
function deleteSel(){
  if(!sel.nodes.size && !sel.edges.size) return;
  const cnt = sel.nodes.size + sel.edges.size;
  pushUndo();
  [...sel.edges].forEach(removeEdge);
  [...sel.nodes].forEach(removeNode);
  clearSel(); renderMinimap();
  toast(`已删除 ${cnt} 个对象`,'ok');
}
function copySel(){
  if(!sel.nodes.size) return;
  const ids = new Set(sel.nodes);
  clipboard = {
    nodes: state.nodes.filter(n=>ids.has(n.id)).map(n=>JSON.parse(JSON.stringify(n))),
    edges: state.edges.filter(e=>ids.has(e.fn)&&ids.has(e.tn)),
  };
}
function pasteSel(at){
  if(!clipboard||!clipboard.nodes.length) return;
  pushUndo(); clearSel();
  const idMap = {};
  let minX=1e9,minY=1e9;
  clipboard.nodes.forEach(n=>{ minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); });
  let cx, cy;
  if(at){ cx=at.x; cy=at.y; } else {
    const r = viewport.getBoundingClientRect();
    const w = toWorld(r.left+r.width/2, r.top+r.height/2); cx=w.x; cy=w.y;
  }
  const offX = cx-minX-150, offY = cy-minY-60;
  clipboard.nodes.forEach(n=>{
    const old = n.id;
    const nn = JSON.parse(JSON.stringify(n));
    nn.id = state.nextId++; nn.x+=offX+24; nn.y+=offY+24;
    idMap[old]=nn.id; state.nodes.push(nn);
    nodesLayer.appendChild(makeNodeEl(nn)); sel.nodes.add(nn.id);
  });
  clipboard.edges.forEach(e=>{
    state.edges.push({id:Date.now()+Math.floor(Math.random()*1000), fn:idMap[e.fn], fp:e.fp, tn:idMap[e.tn], tp:e.tp});
  });
  measurePorts(); renderEdges(); refreshSel(); renderMinimap(); updateStats(); saveLocal();
  toast(`已粘贴 ${clipboard.nodes.length} 个节点`,'ok');
}

/* ================================================================
 *  持久化
 * ================================================================ */
let saveTimer = null;
function saveLocal(){
  if(!settings.autosave) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    syncToTabs();
    try{ localStorage.setItem(LS_KEY, JSON.stringify({tabs, activeTab, runs, settings})); }catch(_){}
    renderTabsBar();
  }, 350);
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d.tabs||!Array.isArray(d.tabs)||!d.tabs.length) return false;
    tabs = d.tabs; activeTab = clamp(d.activeTab||0, 0, tabs.length-1);
    runs = d.runs||[];
    settings = Object.assign(settings, d.settings||{});
    const t = tabs[activeTab];
    state = {name:t.name, nodes:t.nodes, edges:t.edges, nextId:t.nextId};
    view = t.view || {x:60,y:40,scale:1};
    return true;
  }catch(_){ return false; }
}

/* ================================================================
 *  画布交互
 * ================================================================ */
let dragCtx = null;

viewport.addEventListener('mousedown', e=>{
  if(e.button===1){ e.preventDefault(); startPan(e); return; }
  if(e.button!==0) return;
  const nodeEl = e.target.closest('.node');
  const portEl = e.target.closest('.port');

  if(portEl && nodeEl && !running){
    e.preventDefault();
    document.body.classList.add('linking');
    const from = { id:+nodeEl.dataset.id, dir:portEl.dataset.dir, p:+portEl.dataset.p };
    dragCtx = { mode:'link', from, moved:false };
    ghost.style.display='block';
    const fn = nodeById(from.id), def = defOf(fn);
    const fromT = from.dir==='out' ? def.outputs[from.p].t : def.inputs[from.p].t;
    nodesLayer.querySelectorAll('.port').forEach(pt=>{
      const el = pt.closest('.node'); if(!el||+el.dataset.id===from.id) return;
      if(pt.dataset.dir===from.dir) return;
      const od = defOf(nodeById(+el.dataset.id));
      const t = pt.dataset.dir==='out' ? od.outputs[+pt.dataset.p].t : od.inputs[+pt.dataset.p].t;
      if(typeOk(fromT,t)) pt.classList.add('compat');
    });
    return;
  }
  if(nodeEl){
    if(e.target.closest('input,select,textarea,button,.ncollapse')){
      /* 点击控件不阻止聚焦/编辑，但同样选中所属节点（滚轮调值等编辑意图的前提） */
      const cid = +nodeEl.dataset.id;
      if(!sel.nodes.has(cid)) selectNode(cid, e.shiftKey);
      return;
    }
    e.preventDefault();
    const id = +nodeEl.dataset.id;
    dragCtx = { mode:'node', moved:false, sx:e.clientX, sy:e.clientY, undoPushed:false,
      nodes: sel.nodes.has(id)
        ? [...sel.nodes].map(i=>({n:nodeById(i), ox:nodeById(i).x, oy:nodeById(i).y}))
        : [{n:nodeById(id), ox:nodeById(id).x, oy:nodeById(id).y}] };
    if(!sel.nodes.has(id)) selectNode(id, e.shiftKey);
    else if(e.shiftKey) selectNode(id, true);
    nodeEl.style.zIndex = 10;
    return;
  }
  const edgeG = e.target.closest('g.edge');
  if(edgeG){
    if(e.target.closest('.edel')){
      pushUndo(); removeEdge(+edgeG.dataset.id); clearSel(); renderProps(); return;
    }
    if(!e.shiftKey){ sel.nodes.clear(); sel.edges.clear(); }
    sel.edges.add(+edgeG.dataset.id); refreshSel();
    return;
  }
  if(e.ctrlKey||e.metaKey||canvasMode==='select'){ dragCtx={mode:'box', sx:e.clientX, sy:e.clientY, moved:false}; }
  else { startPan(e); }
});
function startPan(e){
  dragCtx = { mode:'pan', sx:e.clientX, sy:e.clientY, ox:view.x, oy:view.y, moved:false };
  viewport.classList.add('panning');
  e.preventDefault&&e.preventDefault();
}
window.addEventListener('mousemove', e=>{
  if(!dragCtx) return;
  const dx = e.clientX-dragCtx.sx, dy = e.clientY-dragCtx.sy;
  if(dragCtx.mode==='pan'){
    if(Math.abs(dx)+Math.abs(dy)>2) dragCtx.moved=true;
    view.x = dragCtx.ox+dx; view.y = dragCtx.oy+dy; applyView();
  }
  else if(dragCtx.mode==='node'){
    if(Math.abs(dx)+Math.abs(dy)>2){
      dragCtx.moved=true;
      if(!dragCtx.undoPushed){ pushUndo(); dragCtx.undoPushed=true; }
    }
    dragCtx.nodes.forEach(it=>{
      if(!it.n) return;
      let nx = it.ox+dx, ny = it.oy+dy;
      if(settings.snap){ nx = Math.round(nx/26)*26; ny = Math.round(ny/26)*26; }
      it.n.x = Math.round(nx); it.n.y = Math.round(ny);
      const el = nodesLayer.querySelector(`.node[data-id="${it.n.id}"]`);
      if(el){ el.style.left=it.n.x+'px'; el.style.top=it.n.y+'px'; }
    });
    updateEdgesOf(dragCtx.nodes.map(it=>it.n.id));
    updateNodeToolbox();
    renderMinimapThrottled();
  }
  else if(dragCtx.mode==='box'){
    dragCtx.moved=true;
    const r = viewport.getBoundingClientRect();
    const x1=Math.min(dragCtx.sx,e.clientX)-r.left, y1=Math.min(dragCtx.sy,e.clientY)-r.top;
    const w=Math.abs(e.clientX-dragCtx.sx), h=Math.abs(e.clientY-dragCtx.sy);
    const bs=$('#boxsel'); bs.style.display='block'; bs.style.left=x1+'px'; bs.style.top=y1+'px';
    bs.style.width=w+'px'; bs.style.height=h+'px';
  }
  else if(dragCtx.mode==='link'){
    dragCtx.moved=true;
    const w = toWorld(e.clientX, e.clientY);
    const c = portCenter(dragCtx.from.id, dragCtx.from.dir, dragCtx.from.p);
    ghost.setAttribute('d', dragCtx.from.dir==='out' ? bezier(c,w) : bezier(w,c));
  }
  else if(dragCtx.mode==='palette'){
    dragCtx.moved=true;
    const g = $('#pal-drag-ghost');
    g.style.left=(e.clientX+14)+'px'; g.style.top=(e.clientY+10)+'px';
    const r = viewport.getBoundingClientRect();
    g.style.outline = (e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)?'2px solid var(--accent)':'';
    const over = document.elementFromPoint(e.clientX,e.clientY);
    dragCtx.overViewport = !!(over&&viewport.contains(over));
  }
});
window.addEventListener('mouseup', e=>{
  if(!dragCtx) return;
  const ctx = dragCtx; dragCtx = null;
  viewport.classList.remove('panning');
  if(ctx.mode==='pan' && !ctx.moved && !e.shiftKey){ clearSel(); }
  else if(ctx.mode==='node'){
    nodesLayer.querySelectorAll('.node').forEach(el=>el.style.zIndex='');
    if(ctx.moved){ measurePorts(); updateStats(); saveLocal(); }
  }
  else if(ctx.mode==='box'){
    const bs=$('#boxsel');
    const w1=toWorld(Math.min(ctx.sx,e.clientX),Math.min(ctx.sy,e.clientY));
    const w2=toWorld(Math.max(ctx.sx,e.clientX),Math.max(ctx.sy,e.clientY));
    bs.style.display='none';
    if(!e.shiftKey){ sel.nodes.clear(); sel.edges.clear(); }
    state.nodes.forEach(n=>{
      const sz = nodeSizeOf(n);
      if(n.x<w2.x && n.x+sz.w>w1.x && n.y<w2.y && n.y+sz.h>w1.y) sel.nodes.add(n.id);
    });
    refreshSel();
  }
  else if(ctx.mode==='link'){
    ghost.style.display='none'; ghost.setAttribute('d','');
    document.body.classList.remove('linking');
    nodesLayer.querySelectorAll('.port').forEach(pt=>pt.classList.remove('compat'));
    const pt = document.elementFromPoint(e.clientX,e.clientY)?.closest('.port');
    if(pt){
      const nodeEl = pt.closest('.node');
      const to = { id:+nodeEl.dataset.id, dir:pt.dataset.dir, p:+pt.dataset.p };
      if(to.id!==ctx.from.id && to.dir!==ctx.from.dir){
        const out = ctx.from.dir==='out'?ctx.from:to, inn = ctx.from.dir==='in'?ctx.from:to;
        if(addEdge(out.id,out.p,inn.id,inn.p)) toast('已创建连线','ok');
        else toast('端口类型不兼容','warn');
      }
    } else if(ctx.moved){
      // 释放到空白：弹出节点搜索，创建后自动连线（ComfyUI litegraph 行为）
      openSearch(toWorld(e.clientX,e.clientY), ctx.from);
    }
  }
  else if(ctx.mode==='palette'){
    $('#pal-drag-ghost').style.display='none';
    if(ctx.overViewport && ctx.moved){
      const w = toWorld(e.clientX,e.clientY);
      const n = addNode(ctx.type, w.x-150, w.y-30);
      selectNode(n.id,false);
    } else if(!ctx.moved){
      const r = viewport.getBoundingClientRect();
      const w = toWorld(r.left+r.width/2, r.top+r.height/2);
      const n = addNode(ctx.type, w.x-150+(Math.random()*60-30), w.y-60+(Math.random()*40-20));
      selectNode(n.id,false);
    }
  }
});
viewport.addEventListener('wheel', e=>{
  /* 仅当指针位于「已选中节点」的编辑控件上时接管滚轮（点中=编辑意图）：
     数字框滚轮=步进数值（累积阈值兼容触控板）、textarea 保留原生滚动、其余控件吞掉；
     未选中节点的控件与空白处一律走画布缩放 */
  const ctl = e.target.closest('input,select,textarea,[contenteditable=true]');
  if(ctl && ctl.closest('.node.selected')){
    if(ctl.tagName==='INPUT' && ctl.type==='number' && !ctl.disabled){
      const now = performance.now();
      ctl.__wacc = (now - (ctl.__wt||0) < 300) ? (ctl.__wacc||0) + e.deltaY : e.deltaY;
      ctl.__wt = now;
      const steps = Math.trunc(Math.abs(ctl.__wacc) / 100);
      if(steps > 0){
        const dir = ctl.__wacc < 0 ? 1 : -1;
        for(let i=0;i<steps;i++) numStep(ctl, dir);
        ctl.__wacc -= Math.sign(ctl.__wacc) * steps * 100;
      }
    }
    else if(ctl.tagName!=='TEXTAREA'){ /* 下拉/文本框：仅吞掉 */ }
    else return;   /* textarea：不阻止默认滚动 */
    e.preventDefault();
    return;
  }
  e.preventDefault();
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&!e.ctrlKey){ view.x-=e.deltaX; view.y-=e.deltaY; applyView(); return; }
  zoomAt(e.deltaY>0?0.9:1.111, e.clientX, e.clientY);
}, {passive:false});

let searchPos = null, searchIdx = 0, searchItems = [], pendingLinkCtx = null;
function openSearch(worldPos, linkCtx){
  searchPos = worldPos;
  pendingLinkCtx = linkCtx||null;
  $('#search-modal').classList.add('show');
  const inp = $('#search-input'); inp.value=''; inp.focus();
  renderSearchList('');
}
function closeSearch(){ $('#search-modal').classList.remove('show'); searchPos=null; pendingLinkCtx=null; }
function renderSearchList(q){
  const s = q.trim().toLowerCase();
  searchItems = Object.entries(DEFS).filter(([k,d])=>
    !s || (d.name+' '+d.kw+' '+d.desc+' '+CATS[d.cat].name).toLowerCase().includes(s)).slice(0,14);
  searchIdx = 0;
  $('#search-list').innerHTML = searchItems.length ? searchItems.map(([k,d],i)=>`
    <div class="s-item ${i===0?'active':''}" data-type="${k}">
      <span class="sicon" style="border:1px solid ${catColor(d.cat)}">${I(d.icon)}</span>
      <div><div class="sn">${esc(d.name)}</div><div class="sd">${esc(d.desc)}</div></div>
      <span class="stag">${CATS[d.cat].name}</span>
    </div>`).join('') : '<div class="s-empty">未找到匹配节点</div>';
}
function confirmSearch(type){
  const p = searchPos || (()=>{ const r=viewport.getBoundingClientRect(); return toWorld(r.left+r.width/2,r.top+r.height/2); })();
  const n = addNode(type, p.x-150, p.y-40);
  // 连线释放到空白后创建节点：自动连接到兼容端口（litegraph 行为）
  if(pendingLinkCtx){
    const lc = pendingLinkCtx;
    const srcNode = nodeById(lc.id);
    if(srcNode){
      const srcDef = defOf(srcNode), newDef = DEFS[type];
      let done = false;
      if(lc.dir==='out'){
        const st = srcDef.outputs[lc.p].t;
        newDef.inputs.some((ip,pi)=>typeOk(st,ip.t) && addEdge(lc.id,lc.p,n.id,pi) && (done=true));
      } else {
        const tt = srcDef.inputs[lc.p].t;
        newDef.outputs.some((op,pi)=>typeOk(op.t,tt) && addEdge(n.id,pi,lc.id,lc.p) && (done=true));
      }
      if(done) toast('已创建节点并自动连线','ok');
    }
    pendingLinkCtx = null;
  }
  selectNode(n.id,false);
  closeSearch();
  toast(`已添加「${DEFS[type].name}」`,'ok');
}
$('#search-input').addEventListener('input', e=>renderSearchList(e.target.value));
$('#search-input').addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!searchItems.length) return;
    searchIdx = (searchIdx + (e.key==='ArrowDown'?1:-1) + searchItems.length) % searchItems.length;
    $$('#search-list .s-item').forEach((el,i)=>el.classList.toggle('active',i===searchIdx));
    $$('#search-list .s-item')[searchIdx]?.scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){
    if(searchItems.length) confirmSearch(searchItems[searchIdx][0]);
  } else if(e.key==='Escape') closeSearch();
});

  const it = e.target.closest('.s-item'); if(it) confirmSearch(it.dataset.type);
